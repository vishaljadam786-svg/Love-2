<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Heart Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Fixed Top Golden Music Button */
        #music-control {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: #1a1100;
            border: 2px solid #ffd700;
            border-radius: 30px;
            color: #ffd700;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 15px #ffd700;
            animation: goldenGlow 2s infinite ease-in-out;
            transition: transform 0.2s ease;
        }

        #music-control:active {
            transform: translateX(-50%) scale(0.95);
        }

        @keyframes goldenGlow {
            0% {
                box-shadow: 0 0 8px #ffd700, 0 0 15px #ffae00, inset 0 0 5px #ffd700;
                border-color: #ffe600;
            }
            50% {
                box-shadow: 0 0 25px #ffd700, 0 0 40px #ff8800, inset 0 0 15px #ffe600;
                border-color: #ffffff;
            }
            100% {
                box-shadow: 0 0 8px #ffd700, 0 0 15px #ffae00, inset 0 0 5px #ffd700;
                border-color: #ffe600;
            }
        }

        #music-icon {
            font-size: 16px;
        }

        #start-btn {
            position: absolute;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            text-align: center;
            transition: transform 0.3s ease;
        }

        #start-btn:hover {
            transform: scale(1.08);
        }

        .heart-icon {
            font-size: 50px;
            color: #ff3366;
            text-shadow: 0 0 20px #ff3366, 0 0 40px #ff0044;
            animation: pulse 1.2s infinite alternate;
        }

        .btn-title {
            font-size: 22px;
            font-weight: bold;
            margin-top: 10px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .btn-subtitle {
            font-size: 11px;
            color: #aaa;
            letter-spacing: 2px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.25); }
        }

        #final-text {
            position: absolute;
            z-index: 5;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            pointer-events: none;
            text-align: center;
            padding: 0 10px;
        }

        .video-box {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #ff3366;
            box-shadow: 0 0 20px #ff0055;
            margin-bottom: 12px;
        }

        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-text-main {
            color: #fff;
            font-size: 26px;
            font-weight: 900;
            text-shadow: 0 0 15px #ff0055, 0 0 30px #ff0055, 0 0 45px #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .mini-heart {
            color: #ff3366;
            font-size: 26px;
            animation: pulse 1s infinite alternate;
            display: inline-block;
        }

        .card-text-sub {
            color: #fff;
            font-size: 12px;
            letter-spacing: 2.5px;
            margin-top: 6px;
            text-transform: uppercase;
            font-weight: 600;
            opacity: 0.95;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.8);
        }
    </style>
</head>
<body>

    <!-- Fixed Golden Music Button -->
    <button id="music-control" onclick="toggleAudio()">
        <span id="music-icon">🎵</span>
        <span id="music-btn-text">PLAY MUSIC</span>
    </button>

    <canvas id="canvas"></canvas>

    <audio id="bg-audio" src="audio.mp3" loop></audio>

    <div id="start-btn" onclick="startExperience(event)">
        <div class="heart-icon">❤️</div>
        <div class="btn-title">Tap to Play Video</div>
        <div class="btn-subtitle">EXPERIENCE THE MAGIC</div>
    </div>

    <div id="final-text">
        <div class="video-box">
            <video id="final-video" src="video.mp4" loop muted playsinline></video>
        </div>
        <div class="card-text-main">
            I Love <span class="mini-heart">❤️</span> You Rasmalai
        </div>
        <div class="card-text-sub">Always & Forever</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const bgAudio = document.getElementById('bg-audio');
        const musicIcon = document.getElementById('music-icon');
        const musicBtnText = document.getElementById('music-btn-text');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function toggleAudio() {
            if (bgAudio.paused) {
                bgAudio.play().then(() => {
                    musicIcon.textContent = '⏸️';
                    musicBtnText.textContent = 'PAUSE MUSIC';
                }).catch(err => console.log("Playback error:", err));
            } else {
                bgAudio.pause();
                musicIcon.textContent = '🎵';
                musicBtnText.textContent = 'PLAY MUSIC';
            }
        }

        let fallingHearts = [];
        let textParticles = [];
        let fireworks = [];
        let tapHearts = [];
        let isStarted = false;
        let showFinal = false;
        let heartProgress = 0;
        
        const sequence = ["3", "2", "1", "YOU", "ARE", "MY", "RASMALAI"];

        class TapHeart {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 18 + 14;
                this.speedY = -(Math.random() * 3 + 2);
                this.speedX = (Math.random() - 0.5) * 3;
                this.opacity = 1;
                this.heartSymbol = ['❤️', '💖', '💕', '💗', '💓'][Math.floor(Math.random() * 5)];
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.opacity -= 0.015;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.opacity);
                ctx.font = `${this.size}px Arial`;
                ctx.fillText(this.heartSymbol, this.x, this.y);
                ctx.restore();
            }
        }

        window.addEventListener('click', (e) => {
            if (e.target.closest('#music-control')) return;
            for (let i = 0; i < 6; i++) {
                tapHearts.push(new TapHeart(e.clientX, e.clientY));
            }
        });

        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('#music-control')) return;
            let touch = e.touches[0];
            for (let i = 0; i < 6; i++) {
                tapHearts.push(new TapHeart(touch.clientX, touch.clientY));
            }
        });

        class FallingHeart {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = -20;
                this.size = Math.random() * 12 + 6;
                this.speedY = Math.random() * 1.5 + 1;
                this.speedX = Math.random() * 0.6 - 0.3;
                this.opacity = Math.random() * 0.7 + 0.3;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y > height) this.reset();
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = '#ff3366';
                ctx.beginPath();
                let topCurveHeight = this.size * 0.3;
                ctx.moveTo(this.x, this.y + topCurveHeight);
                ctx.bezierCurveTo(this.x, this.y, this.x - this.size / 2, this.y, this.x - this.size / 2, this.y + topCurveHeight);
                ctx.bezierCurveTo(this.x - this.size / 2, this.y + (this.size + topCurveHeight) / 2, this.x, this.y + this.size, this.x, this.y + this.size);
                ctx.bezierCurveTo(this.x, this.y + (this.size + topCurveHeight) / 2, this.x + this.size / 2, this.y + (this.size + topCurveHeight) / 2, this.x + this.size / 2, this.y + topCurveHeight);
                ctx.bezierCurveTo(this.x + this.size / 2, this.y, this.x, this.y, this.x, this.y + topCurveHeight);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        class TextParticle {
            constructor(x, y) {
                this.targetX = x;
                this.targetY = y;
                this.x = x + (Math.random() - 0.5) * 40;
                this.y = y + (Math.random() - 0.5) * 40;
                this.size = Math.random() * 2 + 2;
                this.alpha = 0;
                this.targetAlpha = 1;
            }
            update() {
                this.x += (this.targetX - this.x) * 0.2;
                this.y += (this.targetY - this.y) * 0.2;
                if (this.alpha < this.targetAlpha) this.alpha += 0.08;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class FireworkParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 4 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.01;
                this.color = `hsl(${Math.random() * 40 + 330}, 100%, 65%)`;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.03;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 6;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 40; i++) {
            fallingHearts.push(new FallingHeart());
        }

        function createTextParticles(text) {
            textParticles = [];
            let memCanvas = document.createElement('canvas');
            let memCtx = memCanvas.getContext('2d');
            memCanvas.width = width;
            memCanvas.height = height;

            let baseFontSize = text.length > 5 ? width * 0.15 : width * 0.22;
            let fontSize = Math.min(baseFontSize, 120);

            memCtx.fillStyle = '#ffffff';
            memCtx.font = `900 ${fontSize}px 'Arial Black', Gadget, sans-serif`;
            memCtx.textAlign = 'center';
            memCtx.textBaseline = 'middle';
            memCtx.fillText(text, width / 2, height / 2);

            let imgData = memCtx.getImageData(0, 0, width, height).data;
            let step = 3;

            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    let index = (y * width + x) * 4;
                    if (imgData[index + 3] > 128) {
                        textParticles.push(new TextParticle(x, y));
                    }
                }
            }
        }

        function drawRealisticGlowHeart(cx, cy, scale, maxT) {
            ctx.save();
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ff0055';
            ctx.strokeStyle = '#ff3366';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';

            ctx.beginPath();
            let steps = 180;
            for (let i = 0; i <= steps * maxT; i++) {
                let t = (i / steps) * Math.PI * 2;
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                let px = cx + x * scale;
                let py = cy + y * scale;

                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.stroke();

            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ffffff';
            ctx.strokeStyle = '#ff99bb';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            fallingHearts.forEach(h => {
                h.update();
                h.draw();
            });

            textParticles.forEach(p => {
                p.update();
                p.draw();
            });

            if (showFinal) {
                if (heartProgress < 1) heartProgress += 0.02;
                
                let heartScale = Math.min(width, height) * 0.019;
                drawRealisticGlowHeart(width / 2, height / 2 - 10, heartScale, Math.min(heartProgress, 1));

                if (Math.random() < 0.08) {
                    let fx = Math.random() * width;
                    let fy = Math.random() * (height * 0.7);
                    for (let i = 0; i < 30; i++) {
                        fireworks.push(new FireworkParticle(fx, fy));
                    }
                }
                fireworks.forEach((f, index) => {
                    f.update();
                    f.draw();
                    if (f.alpha <= 0) fireworks.splice(index, 1);
                });
            }

            tapHearts.forEach((th, index) => {
                th.update();
                th.draw();
                if (th.opacity <= 0) tapHearts.splice(index, 1);
            });

            requestAnimationFrame(animate);
        }
        animate();

        function startExperience(e) {
            if (e) e.stopPropagation();
            if (isStarted) return;
            isStarted = true;

            document.getElementById('start-btn').style.display = 'none';

            bgAudio.play().then(() => {
                musicIcon.textContent = '⏸️';
                musicBtnText.textContent = 'PAUSE MUSIC';
            }).catch(err => console.log("Audio autoplay suppressed"));

            let step = 0;

            function nextStep() {
                if (step < sequence.length) {
                    createTextParticles(sequence[step]);
                    step++;
                    setTimeout(nextStep, 1100);
                } else {
                    textParticles = [];
                    showFinalCard();
                }
            }

            nextStep();
        }

        function showFinalCard() {
            showFinal = true;
            const finalText = document.getElementById('final-text');
            finalText.style.display = 'flex';

            const video = document.getElementById('final-video');
            video.play().catch(err => console.log("Video autoplay suppressed"));

            setTimeout(() => {
                finalText.style.opacity = '1';
            }, 100);
        }
    </script>
</body>
</html>
