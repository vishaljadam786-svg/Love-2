<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Heart Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            transform: translateZ(0);
        }

        /* Top Golden Music Button */
        #music-control {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: #1a1100;
            border: 2px solid #ffd700;
            border-radius: 30px;
            color: #ffd700;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 15px #ffd700;
            animation: goldenGlow 2s infinite ease-in-out;
            transition: transform 0.2s ease;
        }

        #music-control:active {
            transform: translateX(-50%) scale(0.95);
        }

        @keyframes goldenGlow {
            0% {
                box-shadow: 0 0 8px #ffd700, 0 0 15px #ffae00, inset 0 0 5px #ffd700;
                border-color: #ffe600;
            }
            50% {
                box-shadow: 0 0 25px #ffd700, 0 0 40px #ff8800, inset 0 0 15px #ffe600;
                border-color: #ffffff;
            }
            100% {
                box-shadow: 0 0 8px #ffd700, 0 0 15px #ffae00, inset 0 0 5px #ffd700;
                border-color: #ffe600;
            }
        }

        #start-btn {
            position: absolute;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            text-align: center;
            transition: transform 0.3s ease;
        }

        #start-btn:hover {
            transform: scale(1.08);
        }

        .heart-icon {
            font-size: 50px;
            color: #ff3366;
            text-shadow: 0 0 20px #ff3366, 0 0 40px #ff0044;
            animation: pulse 1.2s infinite alternate;
        }

        .btn-title {
            font-size: 22px;
            font-weight: bold;
            margin-top: 10px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .btn-subtitle {
            font-size: 11px;
            color: #aaa;
            letter-spacing: 2px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.25); }
        }

        /* Final Overlay Screen */
        #final-text {
            position: absolute;
            z-index: 10;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            text-align: center;
            padding: 0 10px;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .final-content {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20;
        }

        .card-text-main {
            color: #fff;
            font-size: 24px;
            font-weight: 900;
            text-shadow: 0 0 15px #ff0055, 0 0 30px #ff0055, 0 0 45px #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .mini-heart {
            color: #ff3366;
            font-size: 24px;
            animation: pulse 1s infinite alternate;
            display: inline-block;
        }

        .card-text-sub {
            color: #fff;
            font-size: 11px;
            letter-spacing: 2.5px;
            margin-top: 4px;
            text-transform: uppercase;
            font-weight: 600;
            opacity: 0.95;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.8);
        }

        .question-text {
            color: #ffd700;
            font-size: 16px;
            font-weight: 700;
            margin-top: 15px;
            text-shadow: 0 0 10px #ffae00;
        }

        /* Proposal Buttons */
        .proposal-btn-group {
            display: flex;
            gap: 15px;
            margin-top: 12px;
            position: relative;
        }

        .btn-yes {
            padding: 8px 22px;
            background: linear-gradient(45deg, #ff0055, #ff3366);
            border: none;
            border-radius: 20px;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff0055;
            transition: transform 0.2s ease;
        }

        .btn-yes:active {
            transform: scale(0.95);
        }

        .btn-no {
            padding: 8px 22px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            color: #eee;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .btn-replay {
            margin-top: 15px;
            background: transparent;
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 5px 14px;
            border-radius: 15px;
            font-size: 11px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        /* Floating Polaroid Photos */
        .polaroid {
            position: absolute;
            width: 90px;
            background: #fff;
            padding: 5px 5px 18px 5px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border-radius: 4px;
            pointer-events: auto;
            animation: floatPhoto 4s ease-in-out infinite alternate;
            transform: translateZ(0);
        }

        .polaroid img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 2px;
        }

        .polaroid-1 {
            top: 15%;
            left: 8%;
            transform: rotate(-10deg);
        }

        .polaroid-2 {
            bottom: 18%;
            right: 8%;
            transform: rotate(12deg);
            animation-delay: -2s;
        }

        @keyframes floatPhoto {
            0% { transform: translateY(0px) rotate(-8deg); }
            100% { transform: translateY(-12px) rotate(-4deg); }
        }

        /* Celebration Modal */
        #celebration-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            backdrop-filter: blur(8px);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-card {
            background: linear-gradient(135deg, #2b0015, #4d0026);
            border: 2px solid #ff3366;
            padding: 25px 20px;
            border-radius: 25px;
            box-shadow: 0 0 40px #ff0055, inset 0 0 15px #ff3366;
            max-width: 320px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateZ(0);
        }

        @keyframes popUp {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-video-box {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #ffd700;
            box-shadow: 0 0 20px #ff0055;
            margin: 10px 0 15px 0;
            background: #000;
            transform: translateZ(0);
        }

        .modal-video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .modal-card h2 {
            color: #ffd700;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 5px;
            text-shadow: 0 0 12px #ffae00;
        }

        .modal-card p {
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            margin-top: 5px;
            text-shadow: 0 0 10px #ff3366;
            line-height: 1.4;
        }

        .modal-close-btn {
            margin-top: 18px;
            padding: 9px 24px;
            background: linear-gradient(45deg, #ff0055, #ff3366);
            border: none;
            color: #fff;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px #ff0055;
            transition: transform 0.2s ease;
        }

        .modal-close-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <button id="music-control" onclick="toggleAudio()">
        <span id="music-icon">🎵</span>
        <span id="music-btn-text">PLAY MUSIC</span>
    </button>

    <canvas id="canvas"></canvas>

    <audio id="bg-audio" src="audio.mp3" loop preload="auto"></audio>

    <div id="start-btn" onclick="startExperience(event)">
        <div class="heart-icon">❤️</div>
        <div class="btn-title">Tap to Start</div>
        <div class="btn-subtitle">EXPERIENCE THE MAGIC</div>
    </div>

    <div id="final-text">
        <div class="polaroid polaroid-1">
            <img src="image1.jpg" alt="Memory 1" onerror="this.src='image1.png'">
        </div>
        <div class="polaroid polaroid-2">
            <img src="image2.jpg" alt="Memory 2" onerror="this.src='image2.png'">
        </div>

        <div class="final-content">
            <div class="card-text-main">
                I Love <span class="mini-heart">❤️</span> You Rasmalai
            </div>
            <div class="card-text-sub">Always & Forever</div>

            <div class="question-text">Will you be my Special One? 💖</div>

            <div class="proposal-btn-group">
                <button class="btn-yes" onclick="acceptProposal()">YES! 💖</button>
                <button id="no-btn" class="btn-no" onmouseover="dodgeNoButton()" onclick="dodgeNoButton()">NO 😜</button>
            </div>

            <button class="btn-replay" onclick="replayMagic()">✨ REPLAY MAGIC</button>
        </div>
    </div>

    <div id="celebration-modal">
        <div class="modal-card">
            <h2>YAYYY! 🎉💖</h2>
            
            <div class="modal-video-box">
                <video id="popup-video" src="video.mp4" loop muted playsinline preload="auto" webkit-playsinline></video>
            </div>

            <p>i know you love me ☺️</p>
            <button class="modal-close-btn" onclick="closeModal()">Love You Too! ❤️</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const bgAudio = document.getElementById('bg-audio');
        const musicIcon = document.getElementById('music-icon');
        const musicBtnText = document.getElementById('music-btn-text');
        const popupVideo = document.getElementById('popup-video');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('load', () => {
            if (popupVideo) {
                popupVideo.load();
            }
        });

        let audioCtx;
        function playSparkleSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800 + Math.random() * 400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1600 + Math.random() * 400, audioCtx.currentTime + 0.15);
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        function toggleAudio() {
            if (bgAudio.paused) {
                bgAudio.play().then(() => {
                    musicIcon.textContent = '⏸️';
                    musicBtnText.textContent = 'PAUSE MUSIC';
                }).catch(err => console.log(err));
            } else {
                bgAudio.pause();
                musicIcon.textContent = '🎵';
                musicBtnText.textContent = 'PLAY MUSIC';
            }
        }

        let fallingHearts = [];
        let textParticles = [];
        let fireworks = [];
        let tapHearts = [];
        let isStarted = false;
        let showFinal = false;
        let heartProgress = 0;
        
        const sequence = ["3", "2", "1", "YOU", "ARE", "MY", "RASMALAI"];

        class TapHeart {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 18 + 14;
                this.speedY = -(Math.random() * 3 + 2);
                this.speedX = (Math.random() - 0.5) * 3;
                this.opacity = 1;
                this.heartSymbol = ['❤️', '💖', '💕', '💗', '💓'][Math.floor(Math.random() * 5)];
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.opacity -= 0.015;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.opacity);
                ctx.font = `${this.size}px Arial`;
                ctx.fillText(this.heartSymbol, this.x, this.y);
                ctx.restore();
            }
        }

        window.addEventListener('click', (e) => {
            if (e.target.closest('#music-control') || e.target.closest('.final-content') || e.target.closest('#celebration-modal')) return;
            playSparkleSound();
            for (let i = 0; i < 5; i++) {
                tapHearts.push(new TapHeart(e.clientX, e.clientY));
            }
        });

        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('#music-control') || e.target.closest('.final-content') || e.target.closest('#celebration-modal')) return;
            playSparkleSound();
            let touch = e.touches[0];
            for (let i = 0; i < 5; i++) {
                tapHearts.push(new TapHeart(touch.clientX, touch.clientY));
            }
        });

        /* Fixed Clean Falling Heart Class */
        class FallingHeart {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = -30 - Math.random() * 50;
                this.size = Math.random() * 14 + 10;
                this.speedY = Math.random() * 1.8 + 1;
                this.speedX = Math.sin(Math.random() * Math.PI) * 0.8 - 0.4;
                this.opacity = Math.random() * 0.7 + 0.3;
                this.symbol = ['❤️', '💖', '💕'][Math.floor(Math.random() * 3)];
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y > height + 20) this.reset();
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.font = `${this.size}px Arial`;
                ctx.fillText(this.symbol, this.x, this.y);
                ctx.restore();
            }
        }

        class TextParticle {
            constructor(x, y) {
                this.targetX = x;
                this.targetY = y;
                this.x = x + (Math.random() - 0.5) * 40;
                this.y = y + (Math.random() - 0.5) * 40;
                this.size = Math.random() * 2 + 2;
                this.alpha = 0;
                this.targetAlpha = 1;
            }
            update() {
                this.x += (this.targetX - this.x) * 0.2;
                this.y += (this.targetY - this.y) * 0.2;
                if (this.alpha < this.targetAlpha) this.alpha += 0.08;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class FireworkParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.01;
                this.color = `hsl(${Math.random() * 60 + 310}, 100%, 65%)`;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.04;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 6;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 35; i++) {
            fallingHearts.push(new FallingHeart());
        }

        function createTextParticles(text) {
            textParticles = [];
            let memCanvas = document.createElement('canvas');
            let memCtx = memCanvas.getContext('2d');
            memCanvas.width = width;
            memCanvas.height = height;

            let baseFontSize = text.length > 5 ? width * 0.15 : width * 0.22;
            let fontSize = Math.min(baseFontSize, 120);

            memCtx.fillStyle = '#ffffff';
            memCtx.font = `900 ${fontSize}px 'Arial Black', Gadget, sans-serif`;
            memCtx.textAlign = 'center';
            memCtx.textBaseline = 'middle';
            memCtx.fillText(text, width / 2, height / 2);

            let imgData = memCtx.getImageData(0, 0, width, height).data;
            let step = 4;

            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    let index = (y * width + x) * 4;
                    if (imgData[index + 3] > 128) {
                        textParticles.push(new TextParticle(x, y));
                    }
                }
            }
        }

        function drawRealisticGlowHeart(cx, cy, scale, maxT) {
            ctx.save();
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#ff0055';
            ctx.strokeStyle = '#ff3366';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';

            ctx.beginPath();
            let steps = 150;
            for (let i = 0; i <= steps * maxT; i++) {
                let t = (i / steps) * Math.PI * 2;
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                let px = cx + x * scale;
                let py = cy + y * scale;

                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.stroke();

            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffffff';
            ctx.strokeStyle = '#ff99bb';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            fallingHearts.forEach(h => {
                h.update();
                h.draw();
            });

            textParticles.forEach(p => {
                p.update();
                p.draw();
            });

            if (showFinal) {
                if (heartProgress < 1) heartProgress += 0.02;
                
                let heartScale = Math.min(width, height) * 0.018;
                drawRealisticGlowHeart(width / 2, height / 2 - 20, heartScale, Math.min(heartProgress, 1));

                if (Math.random() < 0.05) {
                    let fx = Math.random() * width;
                    let fy = Math.random() * (height * 0.7);
                    for (let i = 0; i < 20; i++) {
                        fireworks.push(new FireworkParticle(fx, fy));
                    }
                }
            }

            fireworks.forEach((f, index) => {
                f.update();
                f.draw();
                if (f.alpha <= 0) fireworks.splice(index, 1);
            });

            tapHearts.forEach((th, index) => {
                th.update();
                th.draw();
                if (th.opacity <= 0) tapHearts.splice(index, 1);
            });

            requestAnimationFrame(animate);
        }
        animate();

        function startExperience(e) {
            if (e) e.stopPropagation();
            if (isStarted) return;
            isStarted = true;

            document.getElementById('start-btn').style.display = 'none';

            bgAudio.play().then(() => {
                musicIcon.textContent = '⏸️';
                musicBtnText.textContent = 'PAUSE MUSIC';
            }).catch(err => console.log(err));

            let step = 0;

            function nextStep() {
                if (step < sequence.length) {
                    createTextParticles(sequence[step]);
                    step++;
                    setTimeout(nextStep, 1100);
                } else {
                    textParticles = [];
                    showFinalCard();
                }
            }

            nextStep();
        }

        function showFinalCard() {
            showFinal = true;
            const finalText = document.getElementById('final-text');
            finalText.style.display = 'flex';

            setTimeout(() => {
                finalText.style.opacity = '1';
            }, 100);
        }

        function dodgeNoButton() {
            const noBtn = document.getElementById('no-btn');
            const randomX = (Math.random() - 0.5) * 200;
            const randomY = (Math.random() - 0.5) * 150;
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        function acceptProposal() {
            for (let burst = 0; burst < 3; burst++) {
                setTimeout(() => {
                    let fx = Math.random() * (width * 0.6) + width * 0.2;
                    let fy = Math.random() * (height * 0.5) + height * 0.2;
                    for (let i = 0; i < 50; i++) {
                        fireworks.push(new FireworkParticle(fx, fy));
                    }
                }, burst * 200);
            }
            
            document.getElementById('celebration-modal').style.display = 'flex';
            
            if (popupVideo) {
                popupVideo.currentTime = 0;
                let playPromise = popupVideo.play();
                if (playPromise !== undefined) {
                    playPromise.catch(err => console.log(err));
                }
            }
        }

        function closeModal() {
            document.getElementById('celebration-modal').style.display = 'none';
            if (popupVideo) {
                popupVideo.pause();
            }
        }

        function replayMagic() {
            const finalText = document.getElementById('final-text');
            finalText.style.opacity = '0';
            setTimeout(() => {
                finalText.style.display = 'none';
                showFinal = false;
                heartProgress = 0;
                isStarted = false;
                startExperience();
            }, 500);
        }
    </script>
</body>
</html>
